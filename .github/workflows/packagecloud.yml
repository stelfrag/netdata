---
# Runs PackageCloud cleanup every day at 9pm
name: PackageCloud Cleanup
on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch: null

jobs:
  cleanup:
    name: PackageCloud Cleanup
    runs-on: ubuntu-latest
    if: github.repository == 'netdata/netdata'
    strategy:
      fail-fast: false
      matrix:
        repos:
          - stable
          - edge
          - devel
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          submodules: recursive
      - name: Init Python environment
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: init-python
        with:
          python-version: "3.12"
      - name: Prepare environment
        id: prepare
        run: |
          python -m pip install --require-hashes --only-binary :all: -r .github/scripts/packagecloud-requirements.txt
      - name: Run PackageCloud Cleanup
        id: cleanup
        env:
          PKGCLOUD_TOKEN: ${{ secrets.PACKAGE_CLOUD_API_KEY }}
        run: |
          python .github/scripts/netdata-pkgcloud-cleanup.py -r ${{ matrix.repos }}
